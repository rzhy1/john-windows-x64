name: John the Ripper

on:
  push:
    branches:
      - main
      - master
      - bleeding-jumbo
  pull_request:
    branches:
      - main
      - master
      - bleeding-jumbo
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译 (1=强制, 0=仅检测更新)"
        required: false
        default: "0"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  FORCE_BUILD: ${{ github.event.inputs.force || '0' }}

jobs:
  John-for-Windows:
    runs-on: ubuntu-26.04
    concurrency:
      group: john-build-${{ github.ref }}
      cancel-in-progress: false

    steps:
      # =========================================================
      # 1. Checkout 当前 CI 仓库 (使用 v7)
      # =========================================================
      - name: Checkout CI repository
        uses: actions/checkout@v7

      # =========================================================
      # 2. 检查上游 Openwall John 仓库的更新状态
      # =========================================================
      - id: check_upstream
        name: Check upstream changes
        shell: bash
        run: |
          NEW_SHA=$(git ls-remote https://github.com/openwall/john.git refs/heads/bleeding-jumbo | awk '{print $1}')
          echo "new_sha=$NEW_SHA" >> $GITHUB_OUTPUT

          if [ -f .last_sha ]; then
            OLD_SHA=$(cat .last_sha)
          else
            OLD_SHA=""
          fi
          echo "old_sha=$OLD_SHA" >> $GITHUB_OUTPUT

          echo "================================="
          echo "Found upstream NEW_SHA=$NEW_SHA"
          echo "Found saved OLD_SHA=$OLD_SHA"
          echo "================================="

          if [ "${FORCE_BUILD}" = "1" ]; then
            echo "FORCE_BUILD=1 -> 强制编译"
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$NEW_SHA" = "$OLD_SHA" ]; then
            echo "No upstream changes, skipping build."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New upstream commit detected."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # =========================================================
      # 3. 下载 John 源码 (使用 v8)
      # =========================================================
      - name: Checkout John the Ripper source
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/checkout@v7
        with:
          repository: openwall/john
          ref: bleeding-jumbo
          path: john

      # =========================================================
      # 4. 安装 MinGW 编译链与依赖环境
      # =========================================================
      - name: Install MinGW-w64 dependencies
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            libbz2-dev \
            libgmp-dev \
            zlib1g-dev \
            pkg-config \
            zip \
            unzip

      # =========================================================
      # 5. 编译 Windows x64 版本的静态 zlib
      # =========================================================
      - name: Cross compile zlib
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          wget -q https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          tar -xzf zlib-1.3.2.tar.gz
          cd zlib-1.3.2
          
          make -f win32/Makefile.gcc \
            PREFIX=x86_64-w64-mingw32- \
            SHARED_MODE=0 \
            -j$(nproc)
          
          sudo mkdir -p /usr/local/mingw-zlib/include
          sudo mkdir -p /usr/local/mingw-zlib/lib
          sudo cp zlib.h zconf.h /usr/local/mingw-zlib/include/
          sudo cp libz.a /usr/local/mingw-zlib/lib/

      # =========================================================
      # 6. 配置 OpenCL Windows 交叉编译环境
      # =========================================================
      - name: Setup OpenCL
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          wget -q https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/heads/main.zip
          unzip -q main.zip
          sudo mkdir -p /usr/x86_64-w64-mingw32/include/CL
          sudo cp OpenCL-Headers-main/CL/*.h /usr/x86_64-w64-mingw32/include/CL/
          
          cat > opencl.def << 'EOF'
          LIBRARY OpenCL.dll
          EXPORTS
          clGetPlatformIDs
          clGetPlatformInfo
          clGetDeviceIDs
          clGetDeviceInfo
          clCreateContext
          clCreateContextFromType
          clRetainContext
          clReleaseContext
          clCreateCommandQueue
          clCreateCommandQueueWithProperties
          clRetainCommandQueue
          clReleaseCommandQueue
          clCreateBuffer
          clCreateImage
          clRetainMemObject
          clReleaseMemObject
          clGetMemObjectInfo
          clCreateProgramWithSource
          clCreateProgramWithBinary
          clBuildProgram
          clCompileProgram
          clLinkProgram
          clRetainProgram
          clReleaseProgram
          clGetProgramInfo
          clGetProgramBuildInfo
          clCreateKernel
          clCreateKernelsInProgram
          clSetKernelArg
          clRetainKernel
          clReleaseKernel
          clGetKernelInfo
          clGetKernelWorkGroupInfo
          clEnqueueNDRangeKernel
          clEnqueueTask
          clEnqueueReadBuffer
          clEnqueueWriteBuffer
          clEnqueueCopyBuffer
          clEnqueueMapBuffer
          clEnqueueUnmapMemObject
          clFlush
          clFinish
          clWaitForEvents
          clGetEventInfo
          clCreateUserEvent
          clSetUserEventStatus
          clReleaseEvent
          clGetEventProfilingInfo
          clGetExtensionFunctionAddress
          clGetExtensionFunctionAddressForPlatform
          EOF

          x86_64-w64-mingw32-dlltool -d opencl.def -l libOpenCL.a
          sudo mkdir -p /usr/x86_64-w64-mingw32/lib/
          sudo cp libOpenCL.a /usr/x86_64-w64-mingw32/lib/
          ls -lh /usr/x86_64-w64-mingw32/lib/libOpenCL.a

      # =========================================================
      # 7. 编译 Windows x64 版本的静态 bzip2
      # =========================================================
      - name: Cross compile bzip2
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          wget -q https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar -xzf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          
          make CC=x86_64-w64-mingw32-gcc \
               AR=x86_64-w64-mingw32-ar \
               RANLIB=x86_64-w64-mingw32-ranlib \
               libbz2.a \
               -j$(nproc)
          
          sudo mkdir -p /usr/local/mingw-bzip2/include
          sudo mkdir -p /usr/local/mingw-bzip2/lib
          sudo cp bzlib.h /usr/local/mingw-bzip2/include/
          sudo cp libbz2.a /usr/local/mingw-bzip2/lib/

      # =========================================================
      # 8. 编译 Windows x64 版本的静态 OpenSSL
      # =========================================================
      - name: Build OpenSSL for MinGW
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          wget -q https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz
          tar -xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          
          ./Configure mingw64 \
            --prefix=/usr/local/mingw-openssl \
            --cross-compile-prefix=x86_64-w64-mingw32- \
            no-shared \
            no-tests \
            no-dso \
            -static
          
          make -j$(nproc)
          sudo make install
          ls -la /usr/local/mingw-openssl/lib

      # =========================================================
      # 9. 调整 John 配置并进行交叉编译预配置
      # =========================================================
      - name: Configure John
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        working-directory: john/src
        run: |
          JOHN_VERSION="1.9.0-jumbo-1($(date +%Y%m%d))"
          echo "JOHN_VERSION=${JOHN_VERSION}" >> $GITHUB_ENV
          
          sed -i 's|^//#define JTR_RELEASE_BUILD 1|#define JTR_RELEASE_BUILD 1|' params.h
          sed -i "s/^#define JOHN_VERSION.*/#define JOHN_VERSION \"${JOHN_VERSION}\"/" params.h
          sed -i 's/^#define JUMBO_POSTFIX.*/#define JUMBO_POSTFIX ""/' params.h
          
          sed -i '1i #include <stdio.h>' Win32-dlfcn-port.h
          sed -i 's/<dlfcn.h>/"Win32-dlfcn-port.h"/g' opencl_dynamic_loader.c
          sed -i 's/fchdir([^)]*)/(-1)/g' opencl_common.c
          
          export ac_cv_header_dlfcn_h=no
          export ac_cv_func_dlopen=no
          export ac_cv_func_fchdir=no
          
          ./configure \
            --host=x86_64-w64-mingw32 \
            --build=x86_64-linux-gnu \
            CC=x86_64-w64-mingw32-gcc \
            CXX=x86_64-w64-mingw32-g++ \
            CPPFLAGS="-Duint=unsigned \
                      -I/usr/local/mingw-openssl/include \
                      -I/usr/local/mingw-zlib/include \
                      -I/usr/local/mingw-bzip2/include \
                      -I/usr/x86_64-w64-mingw32/include" \
            CFLAGS="-Ofast -march=x86-64-v3 -funroll-loops -g0 -ffunction-sections -fdata-sections" \
            LDFLAGS="-static \
                     -static-libgcc \
                     -static-libstdc++ \
                     -Wl,--gc-sections \
                     -Wl,--strip-all \
                     -L/usr/local/mingw-openssl/lib \
                     -L/usr/local/mingw-zlib/lib \
                     -L/usr/local/mingw-bzip2/lib \
                     -L/usr/x86_64-w64-mingw32/lib" \
            LIBS="-lOpenCL -lwinpthread -lssl -lcrypto -lz -lbz2 -lws2_32 -lgdi32 -lcrypt32 -lcfgmgr32" \
            --disable-native-tests \
            --enable-opencl

      # =========================================================
      # 10. 编译 John the Ripper
      # =========================================================
      - name: Build John the Ripper
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        working-directory: john/src
        run: |
          make -s clean
          make -sj$(nproc)
          x86_64-w64-mingw32-strip ../run/*.exe || true

      # =========================================================
      # 11. 收集编译产物与运行时所需依赖库
      # =========================================================
      - name: Collect Windows binaries
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          mkdir -p john-windows-x64/run
          
          # 复制二进制和脚本文件
          cp -v john/run/*.exe john-windows-x64/run/ 2>/dev/null || true
          cp -v john/run/*.pl  john-windows-x64/run/ 2>/dev/null || true
          cp -v john/run/*.py  john-windows-x64/run/ 2>/dev/null || true
          
          # 复制配置文件和字典
          cp -v john/run/*.conf john-windows-x64/run/ 2>/dev/null || true
          cp -v john/run/*.chr  john-windows-x64/run/ 2>/dev/null || true
          cp -v john/run/password.lst john-windows-x64/run/ 2>/dev/null || true
          
          # 复制子目录与文档
          cp -r john/run/rules john-windows-x64/run/ 2>/dev/null || true
          cp -r john/run/opencl john-windows-x64/run/ 2>/dev/null || true
          cp -r john/doc john-windows-x64/ 2>/dev/null || true
          
          # 复制必要的 DLL 文件
          cp -v /usr/local/mingw-openssl/bin/*.dll john-windows-x64/run/ 2>/dev/null || true
          cp -v /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll john-windows-x64/run/ 2>/dev/null || true
          cp -v /usr/lib/gcc/x86_64-w64-mingw32/*-win32/libgcc_s_seh-1.dll john-windows-x64/run/ 2>/dev/null || true
          cp -v /usr/lib/gcc/x86_64-w64-mingw32/*-win32/libstdc++-6.dll john-windows-x64/run/ 2>/dev/null || true

      # =========================================================
      # 12. 打包生成压缩包
      # =========================================================
      - name: Package ZIP
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          zip -r john-windows-x64.zip john-windows-x64/

      # =========================================================
      # 13. 上传构件至 GitHub Actions Artifacts (使用 v7)
      # =========================================================
      - name: Upload artifact
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: john-windows-x64
          path: john-windows-x64/

      # =========================================================
      # 14. 验证生成的 exe 及其动态链接库引用
      # =========================================================
      - name: Verify build
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        run: |
          echo "Checking john.exe"
          ls -lh john-windows-x64/run/john.exe
          
          sudo apt-get install -y binutils-mingw-w64-x86-64
          echo ""
          echo "Required DLLs:"
          x86_64-w64-mingw32-objdump -p john-windows-x64/run/john.exe | grep "DLL Name" || true

      # =========================================================
      # 15. 创建/更新 GitHub Release 并发布二进制包
      # =========================================================
      - name: Create Release
        if: ${{ steps.check_upstream.outputs.skip != 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.JOHN_VERSION }}
          name: John the Ripper ${{ env.JOHN_VERSION }}
          allowUpdates: true
          artifacts: john-windows-x64.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # 16. 更新 .last_sha 并推送回 CI 仓库（仅在构建发布成功后执行）
      # =========================================================
      - name: Update last SHA
        if: success() && steps.check_upstream.outputs.skip == 'false'
        run: |
          echo "${{ steps.check_upstream.outputs.new_sha }}" > .last_sha
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .last_sha
          git commit -m "Update john upstream SHA ${{ steps.check_upstream.outputs.new_sha }}" || exit 0
          git push
